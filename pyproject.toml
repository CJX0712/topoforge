[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topoforge"
version = "0.1.0"
description = "TopoForge：零依赖核心 + 顶级开源集成的持久同调拓扑数据分析引擎（作者：晨星）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星", email = "cjx@example.com" }]
keywords = ["topological-data-analysis", "persistent-homology", "vietoris-rips", "betti", "machine-learning"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff==0.16.10"]
ci = ["pytest>=7.4", "ruff==0.16.10"]

[project.scripts]
topoforge = "cli:main"

[tool.setuptools.packages.find]
include = ["topoforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP015"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "UP"]
"__init__.py" = ["F401"]
